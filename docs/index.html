<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fall Trip">
<meta property="og:title" content="Fall Trip">
<meta property="og:description" content="Nine stops. Two days. Come find me at the end of the trail.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8D%81%3C/text%3E%3C/svg%3E">
<title>Fall Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --ink: #0d0f1e;
    --cream: #e9dfc6;
    --cream-shade: #a8987a;
    --blue: #2f8ff0;
    --blue-light: #a6d8ff;
    --pink: #f2a0b4;
    --gold: #f0c060;
    --text: #f4efe2;
    --muted: #9aa0b8;
    /* the current stop's accent, repainted by JS on every level */
    --accent: #f0c060;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 22px;
    line-height: 1.25;
    margin: 0;
    padding-block: 12px;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: 100dvh;
    box-sizing: border-box;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    image-rendering: pixelated;
  }
  .display {
    font-family: 'Press Start 2P', 'VT323', monospace;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  #shell {
    position: relative;
    background: #1f1a24;
    border: 4px solid var(--cream-shade);
    box-shadow: 0 0 0 4px var(--ink), 0 0 0 6px var(--cream-shade);
    line-height: 0;
    max-width: 100%;
    transition: border-color .4s;
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #game { touch-action: none; }

  /* on-screen d-pad */
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin-top: 6px;
  }
  #pad button {
    appearance: none;
    border: 0;
    background: var(--cream);
    color: #1f1a24;
    box-shadow: inset -4px -4px 0 var(--cream-shade), inset 4px 4px 0 #fff8e8;
    font: inherit;
    font-size: 26px;
    cursor: pointer;
    touch-action: none;
    padding: 0;
  }
  #pad button:active, #pad button.held {
    background: var(--accent);
    color: #1f1a24;
    box-shadow: inset 4px 4px 0 rgba(0,0,0,.35), inset -4px -4px 0 rgba(255,255,255,.45);
  }
  #pad button:focus-visible { outline: 3px solid var(--blue-light); outline-offset: 2px; }
  #pad .up    { grid-area: 1 / 2; }
  #pad .left  { grid-area: 2 / 1; }
  #pad .right { grid-area: 2 / 3; }
  #pad .down  { grid-area: 3 / 2; }
  #pad .center { grid-area: 2 / 2; background: var(--cream-shade); box-shadow: none; pointer-events: none; }
  #pad[hidden] { display: none; }

  #hint { color: var(--muted); font-size: 20px; margin: 0; text-align: center; min-height: 26px; }
  #hint button {
    appearance: none; border: 0; background: none; padding: 0 4px;
    font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer;
  }
  #hint button:hover { color: var(--text); }

  /* ---- overlays ---------------------------------------------------------- */
  .overlay {
    position: absolute; inset: 0;
    background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    text-align: center;
    line-height: 1.2;
    padding: 14px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .overlay[hidden] { display: none; }
  .overlay > :not(.heart) { position: relative; z-index: 1; }
  .overlay p { margin: 0; font-size: 21px; color: var(--text); max-width: 24ch; }
  .overlay button {
    margin-top: 4px;
    font-family: 'Press Start 2P', monospace; font-size: 10px;
    background: var(--accent); color: #1f1a24; border: 0;
    padding: 10px 14px;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.45);
    cursor: pointer;
  }
  .overlay button:active { transform: translate(1px,1px); }
  .overlay button.ghost {
    background: none; color: var(--muted); box-shadow: none;
    font-size: 9px; padding: 6px 8px; text-decoration: underline;
  }
  .overlay button.ghost:hover { color: var(--text); }

  /* ---- the postcard that opens each stop --------------------------------- */
  #card {
    background: #f2e9d2;
    color: #2a2418;
    justify-content: flex-start;
    align-items: stretch;
    text-align: left;
    padding: 0;
    /* paper: faint ruled tooth, so it reads as card stock not a flat panel */
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px);
  }
  #card .band {
    background: var(--accent);
    color: #2a2418;
    padding: 7px 12px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    border-bottom: 3px solid rgba(0,0,0,.28);
    flex: none;
  }
  #card .body {
    flex: 1 1 auto;
    padding: 12px 14px 8px;
    display: flex; flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  #card .top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; flex: none;
  }
  #card .meta { min-width: 0; }
  #card .stamp {
    width: 56px; height: 56px;
    background: #fff8e8;
    border: 3px dashed var(--cream-shade);
    box-sizing: border-box;
    image-rendering: pixelated;
    flex: none;
  }
  #card .when {
    font-family: 'Press Start 2P', monospace; font-size: 10px;
    color: #8a6a34; margin: 0 0 6px;
  }
  #card h2 {
    font-family: 'Press Start 2P', monospace; font-size: 12px;
    margin: 0; line-height: 1.45; color: #2a2418;
    text-wrap: balance;
  }
  #card .note {
    /* auto top and bottom: the slack splits evenly so short notes sit centred
       on the card instead of stranding all the blank paper underneath */
    font-size: 23px; line-height: 1.32; color: #4a4030; margin: auto 0;
    max-width: none;
  }
  /* nine squares: where this stop sits in the trip */
  #card .dots { display: flex; gap: 5px; justify-content: center; margin: 12px 0 10px; flex: none; }
  #card .dots span { width: 9px; height: 9px; background: #d8cdb0; }
  #card .dots span.done { background: #8a6a34; }
  #card .dots span.now { background: var(--accent); outline: 2px solid #2a2418; outline-offset: 1px; }
  #card .go {
    margin: 0; align-self: center;
    background: #2a2418; color: #f2e9d2;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.18);
  }

  /* ---- win / itinerary --------------------------------------------------- */
  #win h1 { font-size: 14px; margin: 0; color: var(--gold); text-shadow: 3px 3px 0 #8a6a34; }
  #win img {
    height: 150px; max-height: 38%; width: auto; aspect-ratio: 2 / 3;
    border: 3px solid var(--cream);
    box-shadow: 4px 4px 0 var(--cream-shade);
    image-rendering: pixelated;
    animation: rise .8s steps(6) both;
  }
  #win .love { color: var(--pink); font-size: 26px; }
  #win .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }

  #trip { background: #f2e9d2; color: #2a2418; justify-content: flex-start; align-items: stretch; text-align: left; padding: 0; }
  #trip .band {
    background: var(--gold); color: #2a2418; padding: 7px 12px; flex: none;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    border-bottom: 3px solid rgba(0,0,0,.28);
    display: flex; justify-content: space-between; align-items: center;
  }
  #trip .scroll { flex: 1 1 auto; overflow-y: auto; padding: 8px 14px; min-height: 0; -webkit-overflow-scrolling: touch; }
  #trip .day {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #8a6a34; margin: 8px 0 4px; letter-spacing: .04em;
  }
  #trip .day:first-child { margin-top: 0; }
  #trip ol { list-style: none; margin: 0; padding: 0; }
  #trip li { display: flex; gap: 8px; font-size: 19px; line-height: 1.25; padding: 1px 0; color: #4a4030; }
  #trip li b { flex: none; width: 70px; color: #2a2418; font-weight: normal; }
  #trip .foot { flex: none; padding: 6px 14px 8px; border-top: 3px solid rgba(0,0,0,.18); text-align: center; }
  #trip .foot button { margin: 0; }

  #lose h1 { font-size: 13px; margin: 0; color: #ff6f91; text-shadow: 3px 3px 0 #7a2238; }
  #losepic { width: 64px; height: 80px; }

  /* floating hearts on the win screen */
  .heart {
    position: absolute; z-index: 0; width: 4px; height: 4px; background: var(--pink);
    box-shadow:
      -4px -4px 0 var(--pink), 4px -4px 0 var(--pink),
      -8px 0 0 var(--pink), -4px 0 0 var(--pink), 4px 0 0 var(--pink), 8px 0 0 var(--pink),
      -8px 4px 0 var(--pink), -4px 4px 0 var(--pink), 4px 4px 0 var(--pink), 8px 4px 0 var(--pink),
      -4px 8px 0 var(--pink), 4px 8px 0 var(--pink),
      0 4px 0 var(--pink), 0 8px 0 var(--pink), 0 12px 0 var(--pink);
    animation: float linear infinite;
    pointer-events: none;
  }
  @keyframes float { from { transform: translateY(110%); } to { transform: translateY(-40px); } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .heart, #win img { animation: none; } }
</style>

</head>
<body>
<div id="shell">
  <canvas id="game" width="240" height="232" aria-label="Fall Trip: a maze for every stop on the itinerary"></canvas>

  <div id="card" class="overlay" hidden>
    <div class="band"><span id="cardday">DAY ONE</span><span id="cardnum">STOP 1 / 9</span></div>
    <div class="body">
      <div class="top">
        <div class="meta">
          <p class="when" id="cardwhen">7:00 AM</p>
          <h2 id="cardtitle">THE DEPARTURE</h2>
        </div>
        <canvas class="stamp" id="cardstamp" width="16" height="16" aria-hidden="true"></canvas>
      </div>
      <p class="note" id="cardnote"></p>
      <div class="dots" id="carddots" aria-hidden="true"></div>
      <button class="go" type="button" id="cardgo">LET'S GO</button>
    </div>
  </div>

  <div id="win" class="overlay" hidden>
    <h1 class="display">SEE YOU THERE</h1>

  function makeSprite(rows, override) {
    const c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = (override && override[ch]) || PAL[ch] || '#ff00ff';
      g.fillRect(x, y, 1, 1);
    }));
    return c;
  }
  function dim(rows, pal) {
    // the "not collected yet" ghost: same shape, drained toward the floor color

    return makeSprite(rows, out);

  // ---- audio (tiny chiptune) ---------------------------------------------
  let ac = null;
  function beep(freq, dur, t0 = 0, type = 'square', vol = 0.08) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.02);
  }
  function unlockAudio() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  const sfx = {
    step: () => beep(220, 0.04, 0, 'square', 0.02),

    door: () => { beep(330, 0.1); beep(415, 0.1, 0.1); beep(494, 0.1, 0.2); beep(659, 0.35, 0.3, 'square', 0.06); beep(90, 0.5, 0.3, 'triangle', 0.1); },

    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, i === 6 ? 0.5 : 0.14, i * 0.13)),
    start: () => { beep(440, 0.08); beep(660, 0.12, 0.09); },
    caught: () => { [440, 415, 392, 370].forEach((f, i) => beep(f, 0.18, i * 0.16, 'square', 0.07)); beep(110, 0.7, 0.62, 'triangle', 0.1); },

  const loadProgress = () => { try { return Math.min(LEVELS.length, Math.max(0, +localStorage.getItem(SAVE) || 0)); } catch (e) { return 0; } };
  const saveProgress = (n) => { try { localStorage.setItem(SAVE, String(n)); } catch (e) {} };
  const clearProgress = () => { try { localStorage.removeItem(SAVE); } catch (e) {} };

  const at = (x, y) => (y < 0 || y >= ROWS || x < 0 || x >= COLS) ? '#' : state.map[y][x];
  const isDoor = (x, y) => at(x, y) === 'D';
  const wall = (x, y) => { const c = at(x, y); return c === '#' || (c === 'D' && !state.doorOpen); };
  const inRoom = (x, y) => x >= state.roomX && at(x, y) !== '#';
  const wallForEthan = (x, y) => wall(x, y) || isDoor(x, y) || inRoom(x, y);

  function bfsFrom(sx, sy, blocked = wall) {
    const d = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
    d[sy][sx] = 0;
    const q = [[sx, sy]];
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      for (const k in DIRS) {
        const nx = x + DIRS[k][0], ny = y + DIRS[k][1];
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (blocked(nx, ny) || d[ny][nx] !== -1) continue;
        d[ny][nx] = d[y][x] + 1; q.push([nx, ny]);
      }
    }
    return d;
  }
  function findPath(from, to, blocked = wall) {
    const key = (x, y) => y * COLS + x;
    const prev = new Map([[key(from.x, from.y), null]]);
    const q = [from];
    for (let i = 0; i < q.length; i++) {
      const c = q[i];
      if (c.x === to.x && c.y === to.y) break;
      for (const k in DIRS) {
        const n = { x: c.x + DIRS[k][0], y: c.y + DIRS[k][1] };
        if (n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS) continue;
        if (blocked(n.x, n.y) || prev.has(key(n.x, n.y))) continue;
        prev.set(key(n.x, n.y), c); q.push(n);
      }
    }
    if (!prev.has(key(to.x, to.y))) return [];
    const path = [];
    for (let c = to; c && !(c.x === from.x && c.y === from.y); c = prev.get(key(c.x, c.y))) path.unshift(c);
    return path;
  }

  // Ethan starts as far from her as the level allows, never on the door, a
  // pickup, or inside the room he is not allowed into.
  function pickEthanStart() {
    const d = bfsFrom(state.tx, state.ty);
    let best = { x: state.tx, y: state.ty }, bd = -1;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (wall(x, y) || isDoor(x, y) || inRoom(x, y)) continue;
      if (state.items.some((b) => b.x === x && b.y === y)) continue;
      if (d[y][x] > bd) { bd = d[y][x]; best = { x, y }; }
    }
    return best;
  }

  function loadLevel(i) {
    const L = LEVELS[i];
    state.li = i; state.L = L; state.map = L.map;
    state.items = []; state.got = 0;
    state.doorOpen = false; state.doorAnim = 0; state.banner = null; state.cut = null;
    state.popups = []; state.prog = 1; state.dir = 'down'; state.frame = 0;
    state.advancing = false;
    state.doorPos = null; state.himPos = null;
    state.roomX = L.finale ? L.roomX : Infinity;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const ch = L.map[y][x];
      if (ch === 'P') { state.px = state.tx = x; state.py = state.ty = y; }
      else if ('1234'.includes(ch)) state.items.push({ x, y, n: +ch, taken: false });
      else if (ch === 'D') state.doorPos = { x, y };
      else if (ch === 'M') state.himPos = { x, y };
    }
    state.items.sort((a, b) => a.n - b.n);
    state.hasEthan = !!L.chaser;
    const e = state.ethan;
    if (state.hasEthan) {
      const s = pickEthanStart();
      e.px = e.tx = s.x; e.py = e.ty = s.y; e.prog = 1; e.frame = 0;
      e.wait = 2.5; e.speed = L.chaserSpeed || 2.4;
    }
    held.clear(); queued = null; swipeDir = null;
    document.documentElement.style.setProperty('--accent', L.theme.ac);
    document.getElementById('shell').style.borderColor = L.theme.wb;
  }

  // ---- screens ------------------------------------------------------------
  const el = (id) => document.getElementById(id);
  const hideAll = () => ['card', 'win', 'trip', 'lose'].forEach((k) => { el(k).hidden = true; });

  function setHint() {
    const h = el('hint');
    if (state.screen === 'title') {
      const p = loadProgress();
      h.innerHTML = p > 0 && p < LEVELS.length
        ? 'Picking up at stop ' + (p + 1) + ' of ' + LEVELS.length + '.'
        : 'Nine stops. Two days. Arrow keys, swipe, or the pad.';
      if (p > 0) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'start over';
        b.addEventListener('click', () => { clearProgress(); setHint(); });
        h.append(' ', b);
      }
      return;
    }
    const L = state.L;
    h.textContent = 'Grab all 4 ' + L.label.toLowerCase() + '. Find the door.' + (L.chaser ? " Don't let Ethan catch you." : '');
  }

  function showCard(i) {
    const L = LEVELS[i];
    state.li = i; state.screen = 'card';
    document.documentElement.style.setProperty('--accent', L.theme.ac);
    el('cardday').textContent = L.day === 1 ? 'DAY ONE' : 'DAY TWO';
    el('cardnum').textContent = 'STOP ' + (i + 1) + ' / ' + LEVELS.length;
    el('cardwhen').textContent = L.when;
    el('cardtitle').textContent = L.title;
    el('cardnote').textContent = L.note;
    const dots = el('carddots');
    dots.innerHTML = '';
    for (let k = 0; k < LEVELS.length; k++) {
      const s = document.createElement('span');
      if (k < i) s.className = 'done'; else if (k === i) s.className = 'now';
      dots.appendChild(s);
    }
    const st = el('cardstamp'), g = st.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, 16, 16);
    g.drawImage(spr.item[L.item], 0, 0);
    hideAll();
    el('card').hidden = false;
    el('cardgo').focus({ preventScroll: true });
  }

  function beginLevel(i) {
    unlockAudio();
    hideAll();
    loadLevel(i);
    state.screen = 'play';
    setHint();
    state.banner = { lines: LEVELS[i].banner, t: 0, dur: 4 };
    sfx.start();
  }

  function startTitle() {
    state.screen = 'title';
    state.L = LEVELS[0];
    hideAll();
    document.documentElement.style.setProperty('--accent', '#f0c060');
    document.getElementById('shell').style.borderColor = 'var(--cream-shade)';
    setHint();
  }

  function openDoor() {
    state.doorOpen = true;
    state.banner = { lines: state.L.finale ? ['THE TRAIL OPENS'] : ['THE DOOR OPENS'], t: 0, dur: 2.6 };
    sfx.door();
  }

  function completeLevel() {
    if (state.advancing) return;
    state.advancing = true;
    state.screen = 'done';
    saveProgress(state.li + 1);
    sfx.stop();
    setTimeout(() => showCard(state.li + 1), 850);
  }

  function caught() {
    state.screen = 'lose';
    held.clear(); queued = null; swipeDir = null;
    sfx.caught();
    setTimeout(() => { el('lose').hidden = false; }, 700);
  }

  // ---- the finale: she walks to him, they hug, then the trip --------------
  function beginCutscene() {
    state.screen = 'cutscene';
    held.clear(); queued = null; swipeDir = null;
    const target = { x: state.himPos.x - 1, y: state.himPos.y };
    state.cut = { path: findPath({ x: state.tx, y: state.ty }, target), phase: 'walk', t: 0, hugT: 0 };
  }
  function updateCutscene(dt) {
    const c = state.cut;
    c.t += dt;
    if (c.phase === 'walk') {
      stepWalk(dt);
      if (state.prog >= 1) {
        if (c.path.length) {
          const n = c.path.shift();
          const d = n.x > state.tx ? 'right' : n.x < state.tx ? 'left' : n.y > state.ty ? 'down' : 'up';
          tryMove(d); state.frame ^= 1; sfx.step();
        } else { c.phase = 'pause'; c.t = 0; state.dir = 'right'; }
      }
    } else if (c.phase === 'pause') {
      if (c.t > 0.5) { c.phase = 'hug'; c.t = 0; sfx.hug(); }
    } else if (c.phase === 'hug') {
      c.hugT = Math.min(1, c.t / 0.5);
      if (c.t > 0.3 && Math.floor(c.t * 6) !== Math.floor((c.t - dt) * 6) && c.t < 2.4) {
        state.popups.push({ x: state.himPos.x - 0.5 + (Math.random() - 0.5), y: state.himPos.y - 0.3 - Math.random() * 0.4, t: 0, big: true });
      }
      if (c.t > 3.2) win();
    }
  }
  function win() {
    state.screen = 'win';
    saveProgress(LEVELS.length);
    sfx.win();
    const overlay = el('win');
    hideAll();
    overlay.hidden = false;
    overlay.querySelectorAll('.heart').forEach((h) => h.remove());
    for (let i = 0; i < 9; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.style.left = (6 + Math.random() * 88) + '%';
      h.style.animationDuration = (4 + Math.random() * 4) + 's';
      h.style.animationDelay = (-Math.random() * 6) + 's';
      h.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
      overlay.appendChild(h);
    }
  }

  // ---- movement -----------------------------------------------------------
  function wantDir() {
    if (queued) { const d = queued; queued = null; return d; }
    for (const d of ['up', 'down', 'left', 'right']) if (held.has(d)) return d;
    return swipeDir;
  }
  function tryMove(d) {
    const [dx, dy] = DIRS[d];
    state.dir = d;
    if (wall(state.tx + dx, state.ty + dy)) { if (d === swipeDir) swipeDir = null; return false; }
    state.px = state.tx; state.py = state.ty;
    state.tx += dx; state.ty += dy; state.prog = 0;
    return true;
  }
  function stepWalk(dt) {
    if (state.prog < 1) { state.prog = Math.min(1, state.prog + dt * SPEED); return state.prog === 1; }
    return false;
  }
  function arrive() {
    const b = state.items.find((b) => !b.taken && b.x === state.tx && b.y === state.ty);
    if (b) {
      b.taken = true; state.got++;
      state.popups.push({ x: b.x, y: b.y, t: 0 });
      sfx.pickup();
      if (state.got === state.items.length) setTimeout(openDoor, 450);
    }
    if (!state.doorOpen) return;
    if (state.L.finale) { if (inRoom(state.tx, state.ty)) beginCutscene(); }
    else if (isDoor(state.tx, state.ty)) completeLevel();
  }
  function updateEthan(dt) {
    const e = state.ethan;
    if (e.wait > 0) { e.wait -= dt; return; }
    if (e.prog < 1) e.prog = Math.min(1, e.prog + dt * e.speed);
    if (e.prog >= 1) {
      const path = findPath({ x: e.tx, y: e.ty }, { x: state.tx, y: state.ty }, wallForEthan);
      if (path.length) {
        const n = path[0];
        e.px = e.tx; e.py = e.ty; e.tx = n.x; e.ty = n.y; e.prog = 0; e.frame ^= 1;
      }
    }
    const ex = e.px + (e.tx - e.px) * e.prog, ey = e.py + (e.ty - e.py) * e.prog;
    const sx = state.px + (state.tx - state.px) * state.prog, sy = state.py + (state.ty - state.py) * state.prog;
    if (Math.hypot(ex - sx, ey - sy) < 0.55) caught();
  }
  function updatePlay(dt) {
    if (stepWalk(dt)) arrive();
    if (state.screen !== 'play') return;
    if (state.prog >= 1) {
      const d = wantDir();
      if (d && tryMove(d)) { state.frame ^= 1; sfx.step(); }
    }
    if (state.hasEthan) updateEthan(dt);
  }
  function update(dt) {
    state.t += dt;
    if (state.doorOpen && state.doorAnim < 1) state.doorAnim = Math.min(1, state.doorAnim + dt * 1.5);
    if (state.banner && (state.banner.t += dt) > state.banner.dur) state.banner = null;
    state.popups = state.popups.filter((p) => (p.t += dt) < 0.7);
    if (state.screen === 'play') updatePlay(dt);
    else if (state.screen === 'cutscene') updateCutscene(dt);
    else if (state.screen === 'done') stepWalk(dt);
  }

  // ---- render -------------------------------------------------------------
  // Deterministic per-tile noise, so the rock walls stay put between frames.
  function hash(x, y) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function drawWallTile(X, Y, x, y) {
    const th = state.L.theme;
    ctx.fillStyle = th.wb; ctx.fillRect(X, Y, TILE, TILE);
    ctx.fillStyle = th.wa; ctx.fillRect(X, Y, TILE, 2);
    ctx.fillStyle = th.wc;
    if (state.L.pattern === 'brick') {
      ctx.fillRect(X, Y + 7, TILE, 1);
      const off = (y % 2) ? 3 : 11;
      ctx.fillRect(X + off, Y + 2, 1, 5);
      ctx.fillRect(X + ((off + 8) % 16), Y + 8, 1, 6);
    } else if (state.L.pattern === 'rock') {
      for (let i = 0; i < 5; i++) {
        const r = hash(x * 31 + i, y * 17 + i * 7);
        const rx = 1 + Math.floor(r * 12), ry = 3 + Math.floor((r * 997 % 1) * 10);
        ctx.fillRect(X + rx, Y + ry, 2, 2);
      }
    } else {
      for (let i = 3; i < TILE; i += 4) ctx.fillRect(X + i, Y + 3, 1, TILE - 5);
    }
    ctx.fillStyle = th.wd; ctx.fillRect(X, Y + TILE - 2, TILE, 2);
    // walls facing an open tile get a cast shadow so the maze reads as 3d
    if (at(x, y + 1) !== '#') { ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(X, Y + TILE - 3, TILE, 3); }
  }
  function drawFloorTile(X, Y, x, y) {
    const th = state.L.theme;
    const light = (x + y) % 2 === 0;
    ctx.fillStyle = light ? th.fa : th.fb;
    ctx.fillRect(X, Y, TILE, TILE);
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.fillRect(X + 1, Y + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(X + 7, Y + 7, 2, 2);
  }
  function drawRoomTile(X, Y, x, y) {
    const lit = state.doorAnim;
    const light = (x + y) % 2 === 0;
    ctx.fillStyle = light ? '#3a2a22' : '#33241d';
    ctx.fillRect(X, Y, TILE, TILE);
    ctx.fillStyle = '#2b1e18';
    ctx.fillRect(X, Y + 7, TILE, 1);
    ctx.fillRect(X + (light ? 4 : 11), Y, 1, TILE);
    if (lit < 1) { ctx.fillStyle = 'rgba(13,15,30,' + ((1 - lit) * 0.92) + ')'; ctx.fillRect(X, Y, TILE, TILE); }
  }
  function drawDoor(X, Y) {
    if (!state.doorOpen) { ctx.drawImage(spr.door, X, Y); return; }
    const a = state.doorAnim, th = state.L.theme;
    ctx.fillStyle = '#3a2212'; ctx.fillRect(X, Y, TILE, TILE);
    ctx.fillStyle = '#33241d'; ctx.fillRect(X + 1, Y + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = 'rgba(255,190,100,' + (0.25 * a) + ')'; ctx.fillRect(X - 6, Y + 2, TILE + 6, TILE - 4);
    const w = Math.max(0, Math.round(6 * (1 - a)));
    if (w) { ctx.fillStyle = '#7a4a2a'; ctx.fillRect(X + 1, Y + 1, w, TILE - 2); }
    // an arrow winking through the opening, so the exit is unmistakable
    if (!state.L.finale) {
      // pulses rather than blinks: the way out is never invisible
      ctx.globalAlpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(state.t * 6));
      ctx.fillStyle = th.ac;
      ctx.fillRect(X + 7, Y + 4, 2, 6);
      ctx.fillRect(X + 5, Y + 8, 6, 2);
      ctx.fillRect(X + 6, Y + 10, 4, 2);
      ctx.globalAlpha = 1;
    }
  }
  function drawMaze() {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const X = x * TILE, Y = HUD + y * TILE, ch = state.map[y][x];
      if (ch === '#') drawWallTile(X, Y, x, y);
      else if (ch === 'D') drawDoor(X, Y);
      else if (x >= state.roomX) drawRoomTile(X, Y, x, y);
      else drawFloorTile(X, Y, x, y);
    }
  }
  function drawItems() {
    const key = state.L.item;
    const bob = Math.round(Math.sin(state.t * 4) * 1.5);
    for (const b of state.items) {
      if (b.taken) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(b.x * TILE + 3, HUD + b.y * TILE + 13, 10, 2);
      ctx.drawImage(spr.item[key], b.x * TILE, HUD + b.y * TILE + bob);
    }
  }
  function drawHUD() {
    const L = state.L, th = L.theme;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(0, 0, cv.width, HUD);
    ctx.fillStyle = th.ac; ctx.fillRect(0, HUD - 2, cv.width, 2);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = th.ac; ctx.fillText((state.li + 1) + '/' + LEVELS.length, 4, 8);
    ctx.fillStyle = '#f4efe2'; ctx.fillText(L.short, 32, 8);
    for (let i = 0; i < 4; i++) {
      const s = i < state.got ? spr.item[L.item] : spr.itemDim[L.item];
      ctx.drawImage(s, cv.width - 76 + i * 18, 4);
    }
  }
  function drawHim() {
    if (!state.himPos || state.doorAnim <= 0) return;
    const hugging = state.cut && state.cut.phase === 'hug';
    const lean = hugging ? Math.round(state.cut.hugT * 4) : 0;
    const X = state.himPos.x * TILE - lean, Y = HUD + state.himPos.y * TILE;
    ctx.globalAlpha = state.doorAnim;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(X + 4, Y + 14, 8, 2);
    if (hugging) ctx.drawImage(spr.himHug, X, Y - 7);
    else {
      const hop = state.doorOpen && !state.cut ? -Math.abs(Math.round(Math.sin(state.t * 5) * 1.2)) : 0;
      ctx.drawImage(spr.him, X, Y - 7 + hop);
    }
    ctx.globalAlpha = 1;
  }
  function drawEthan() {
    if (!state.hasEthan) return;
    const e = state.ethan;
    const x = (e.px + (e.tx - e.px) * e.prog) * TILE, y = (e.py + (e.ty - e.py) * e.prog) * TILE + HUD;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(Math.round(x) + 4, Math.round(y) + 14, 8, 2);
    ctx.drawImage(spr.ethan[e.prog < 1 ? e.frame : 0], Math.round(x), Math.round(y) - 5);
    if (e.wait > 0 && Math.floor(state.t * 3) % 2 === 0) {
      ctx.fillStyle = '#f0c060';
      ctx.fillRect(Math.round(x) + 7, Math.round(y) - 13, 2, 5);
      ctx.fillRect(Math.round(x) + 7, Math.round(y) - 7, 2, 2);
    }
  }
  function drawShelly() {
    let x = (state.px + (state.tx - state.px) * state.prog) * TILE;
    const y = (state.py + (state.ty - state.py) * state.prog) * TILE + HUD;
    const hugging = state.cut && state.cut.phase === 'hug';
    if (hugging) x += Math.round(state.cut.hugT * 5);
    const f = state.prog < 1 ? state.frame : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(Math.round(x) + 4, Math.round(y) + 14, 8, 2);
    ctx.drawImage(hugging ? spr.shellyHug : spr.shelly[f], Math.round(x), Math.round(y) - 5);
  }
  function drawPopups() {
    for (const p of state.popups) {
      const y = HUD + p.y * TILE - 4 - p.t * 18;
      ctx.globalAlpha = 1 - p.t / 0.7;
      ctx.drawImage(p.big ? spr.heartBig : spr.heart, Math.round(p.x * TILE) + 4, Math.round(y));
      ctx.globalAlpha = 1;
    }
  }
  function drawBanner() {
    if (!state.banner) return;
    const { lines, t, dur } = state.banner;
    const a = Math.min(1, t * 4, (dur - t) * 2);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = '8px "Press Start 2P", monospace';
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16;
    const h = lines.length * 12 + 10;
    const X = Math.round(cv.width / 2 - w / 2), Y = HUD + 6 * TILE - Math.round(h / 2) + 8;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(X, Y, w, h);
    ctx.fillStyle = state.L.theme.ac;
    ctx.fillRect(X, Y, w, 2); ctx.fillRect(X, Y + h - 2, w, 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, cv.width / 2, Y + 7 + i * 12));
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  const TITLE_ITEMS = ['leaf', 'cheese', 'lift', 'beer', 'coffee'];
  function drawTitle() {
    const cx = cv.width / 2;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = (x % 2) ? '#2a2432' : '#1f1a24';
      ctx.fillRect(x * TILE, 156, TILE, TILE);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillStyle = '#8a6a34'; ctx.fillText('FALL TRIP', cx + 2, 36);
    ctx.fillStyle = '#f0c060'; ctx.fillText('FALL TRIP', cx, 34);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillStyle = '#9aa0b8'; ctx.fillText('THE CATSKILLS', cx, 62);
    ctx.fillStyle = '#f4efe2'; ctx.fillText('NINE STOPS', cx, 82);
    ctx.fillStyle = '#f4efe2'; ctx.fillText('TWO DAYS', cx, 96);
    TITLE_ITEMS.forEach((k, i) => {
      const bob = Math.round(Math.sin(state.t * 3 + i * 0.7) * 2);
      ctx.drawImage(spr.item[k], 40 + i * 33, 116 + bob);
    });
    ctx.drawImage(spr.shelly[Math.floor(state.t * 3) % 2], cx - 8, 152);
    const p = loadProgress();
    if (Math.floor(state.t * 2) % 2 === 0) {
      ctx.fillStyle = '#f0c060';
      ctx.fillText(p > 0 && p < LEVELS.length ? 'TAP TO CONTINUE' : 'TAP TO START', cx, 196);
    }
    if (p > 0 && p < LEVELS.length) {
      ctx.fillStyle = '#9aa0b8';
      ctx.fillText('STOP ' + (p + 1) + ' OF ' + LEVELS.length, cx, 212);
    }
    ctx.textAlign = 'left';
  }
  function render() {
    if (state.screen === 'title') { drawTitle(); return; }
    drawMaze(); drawItems(); drawHim(); drawEthan(); drawShelly(); drawPopups(); drawHUD(); drawBanner();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  // ---- input --------------------------------------------------------------
  function startFromProgress() {
    unlockAudio();
    const p = loadProgress();
    if (p >= LEVELS.length) { clearProgress(); showCard(0); } else showCard(p);
  }
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  addEventListener('keydown', (e) => {
    const d = KEYS[e.key];
    if (state.screen === 'title' && (d || e.key === ' ' || e.key === 'Enter')) { startFromProgress(); e.preventDefault(); return; }
    if (state.screen !== 'play') return;
    if (d) { held.add(d); queued = d; e.preventDefault(); }
  });
  addEventListener('keyup', (e) => { const d = KEYS[e.key]; if (d) held.delete(d); });

  for (const btn of document.querySelectorAll('#pad button')) {
    const d = btn.dataset.dir;
    const press = (e) => {
      e.preventDefault();
      if (state.screen === 'title') { startFromProgress(); return; }
      if (state.screen !== 'play') return;
      held.add(d); queued = d; btn.classList.add('held');
    };
    const release = () => { held.delete(d); btn.classList.remove('held'); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  let sw = null;
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.screen === 'title') { startFromProgress(); return; }
    sw = { x: e.clientX, y: e.clientY, moved: false };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!sw || state.screen !== 'play') return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.hypot(dx, dy) < 18) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    swipeDir = d; queued = d;
    sw.x = e.clientX; sw.y = e.clientY; sw.moved = true;
  });
  const endSwipe = () => { if (sw && !sw.moved) swipeDir = null; sw = null; };
  cv.addEventListener('pointerup', endSwipe);
  cv.addEventListener('pointercancel', endSwipe);

  el('cardgo').addEventListener('click', () => beginLevel(state.li));
  el('seetrip').addEventListener('click', () => { el('win').hidden = true; el('trip').hidden = false; });
  el('tripback').addEventListener('click', () => { el('trip').hidden = true; el('win').hidden = false; });
  for (const b of document.querySelectorAll('.again')) {
    b.addEventListener('click', () => {
      if (state.screen === 'win') { clearProgress(); showCard(0); } else beginLevel(state.li);
    });
  }

  // the caught screen gets Ethan's face, scaled up
  {
    const c = el('losepic'), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(spr.ethan[0], 0, 0, 16, 20, 0, 0, 64, 80);
  }

  // the full itinerary, built from the levels so it can never drift from them
  {
    const body = el('tripbody');
    const rows = [];
    LEVELS.forEach((L) => {
      if (L.short === "JOSIE'S") rows.push({ day: 2, when: '8:00 AM', title: 'Wake up, no alarm' });
      rows.push({ day: L.day, when: L.when, title: L.title });
    });
    let day = 0;
    let ol = null;
    rows.forEach((r) => {
      if (r.day !== day) {
        day = r.day;
        const h = document.createElement('p');
        h.className = 'day';
        h.textContent = day === 1 ? 'DAY ONE' : 'DAY TWO';
        body.appendChild(h);
        ol = document.createElement('ol');
        body.appendChild(ol);
      }
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = r.when;
      const s = document.createElement('span');
      s.textContent = r.title;
      li.append(b, s);
      ol.appendChild(li);
    });
  }

  // ---- sizing -------------------------------------------------------------
  // Fractional scaling on purpose: on a 3x phone screen the game pixels land on
  // 4 or 5 device pixels each, which reads as crisp. Integer-only scaling would
  // leave the screen tiny on most phones.
  function fit() {
    const vw = document.documentElement.clientWidth;
    const vh = window.visualViewport ? window.visualViewport.height : document.documentElement.clientHeight;
    const padH = 56 * 3 + 8 + 6 + 30 + 20;
    const availW = Math.min(vw - 32 - 20, 560);
    const availH = Math.max(200, vh - padH - 24 - 20);
    const scale = Math.min(availW / cv.width, availH / cv.height, 3);
    cv.style.width = Math.floor(cv.width * scale) + 'px';
    cv.style.height = Math.floor(cv.height * scale) + 'px';
  }
  addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();

  startTitle();
  (document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve())
    .catch(() => {}).finally(() => requestAnimationFrame(loop));
})();
</script>


</body>
