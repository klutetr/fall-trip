<title>Fall Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root {
    --ink: #0d0f1e;
    --cream: #e9dfc6;
    --cream-shade: #a8987a;
    --blue-light: #a6d8ff;
    --pink: #f2a0b4;
    --gold: #f0c060;
    --text: #f4efe2;
    --muted: #9aa0b8;
    /* the current stop's accent, repainted by JS on every level */
    --accent: #f0c060;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: 'VT323', 'Courier New', monospace;
    font-size: 22px;
    line-height: 1.25;
    margin: 0;
    padding-block: 12px;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: 100dvh;
    box-sizing: border-box;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    image-rendering: pixelated;
  }
  .display {
    font-family: 'Press Start 2P', 'VT323', monospace;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  #shell {
    position: relative;
    background: #1f1a24;
    border: 4px solid var(--cream-shade);
    box-shadow: 0 0 0 4px var(--ink), 0 0 0 6px var(--cream-shade);
    line-height: 0;
    max-width: 100%;
    transition: border-color .4s;
  }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #game { touch-action: none; }

  /* on-screen d-pad */
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin-top: 6px;
  }
  #pad button {
    appearance: none;
    border: 0;
    background: var(--cream);
    color: #1f1a24;
    box-shadow: inset -4px -4px 0 var(--cream-shade), inset 4px 4px 0 #fff8e8;
    font: inherit;
    font-size: 26px;
    cursor: pointer;
    touch-action: none;
    padding: 0;
  }
  #pad button:active, #pad button.held {
    background: var(--accent);
    color: #1f1a24;
    box-shadow: inset 4px 4px 0 rgba(0,0,0,.35), inset -4px -4px 0 rgba(255,255,255,.45);
  }
  #pad button:focus-visible { outline: 3px solid var(--blue-light); outline-offset: 2px; }
  #pad .up    { grid-area: 1 / 2; }
  #pad .left  { grid-area: 2 / 1; }
  #pad .right { grid-area: 2 / 3; }
  #pad .down  { grid-area: 3 / 2; }
  #pad .center { grid-area: 2 / 2; background: var(--cream-shade); box-shadow: none; pointer-events: none; }

  #hint { color: var(--muted); font-size: 20px; margin: 0; text-align: center; min-height: 26px; }
  #hint button {
    appearance: none; border: 0; background: none; padding: 0 4px;
    font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer;
  }
  #hint button:hover { color: var(--text); }

  /* ---- overlays ---------------------------------------------------------- */
  .overlay {
    position: absolute; inset: 0;
    background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    text-align: center;
    line-height: 1.2;
    padding: 14px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .overlay[hidden] { display: none; }
  .overlay > :not(.heart) { position: relative; z-index: 1; }
  .overlay p { margin: 0; font-size: 21px; color: var(--text); max-width: 24ch; }
  .overlay button {
    margin-top: 4px;
    font-family: 'Press Start 2P', monospace; font-size: 10px;
    background: var(--accent); color: #1f1a24; border: 0;
    padding: 10px 14px;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.45);
    cursor: pointer;
  }
  .overlay button:active { transform: translate(1px,1px); }
  .overlay button.ghost {
    background: none; color: var(--muted); box-shadow: none;
    font-size: 9px; padding: 6px 8px; text-decoration: underline;
  }
  .overlay button.ghost:hover { color: var(--text); }

  /* ---- the checklist -----------------------------------------------------
     The paper between stops, and again at the end: one line per stop, the
     ones behind us crossed off, the next one lit. */
  #card, #trip {
    background: #f2e9d2;
    color: #2a2418;
    justify-content: flex-start;
    align-items: stretch;
    text-align: left;
    padding: 0;
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px);
  }
  #card .band, #trip .band {
    color: #2a2418;
    padding: 7px 12px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    border-bottom: 3px solid rgba(0,0,0,.28);
    flex: none;
  }
  #card .band { background: var(--accent); }
  #trip .band { background: var(--gold); }

  .sheet {
    position: relative;
    flex: 1 1 auto; overflow-y: auto; min-height: 0;
    padding: 10px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .sheet .day {
    font-family: 'Press Start 2P', monospace; font-size: 9px;
    color: #8a6a34; margin: 10px 0 5px; letter-spacing: .04em;
  }
  .sheet .day:first-child { margin-top: 0; }
  .sheet ol { list-style: none; margin: 0; padding: 0; }
  .sheet li {
    display: flex; align-items: center; gap: 8px;
    font-size: 20px; line-height: 1.2;
    padding: 3px 4px; color: #6f6450;
    transition: color .3s, background-color .3s;
  }
  .sheet .when { flex: none; width: 74px; white-space: nowrap; font-weight: normal; }
  .sheet .what { position: relative; }
  .sheet li.done { color: #9c907a; }
  /* the stop she is about to walk: lit paper, and its stamp for a marker */
  .sheet li.now { color: #2a2418; background: #fff8e8; box-shadow: inset 3px 0 0 var(--accent); }

  /* the marker: an empty box until the stop is behind us, then a tick */
  .sheet .mark { position: relative; flex: none; width: 16px; height: 16px; }
  .sheet .box {
    position: absolute; inset: 0;
    background: #fff8e8; box-shadow: inset 0 0 0 2px #c0b291;
    transition: opacity .25s, box-shadow .2s;
  }
  .sheet .tick {
    position: absolute; left: 3px; top: 9px; width: 2px; height: 2px;
    color: #2a2418; background: currentColor;
    box-shadow: 2px 2px 0, 4px 0 0, 6px -2px 0, 8px -4px 0;
    transform: scale(0); transform-origin: 1px 1px;
    transition: transform .2s steps(4);
  }
  .sheet .stamp {
    position: absolute; inset: 0; width: 16px; height: 16px;
    image-rendering: pixelated; opacity: 0; transition: opacity .25s;
  }
  .sheet li.now .box { opacity: 0; }
  .sheet li.now .stamp { opacity: 1; }
  .sheet li.done .box { box-shadow: inset 0 0 0 2px #2a2418; }
  .sheet li.done .tick { transform: scale(1); }

  /* the line through a stop, drawn on as it is crossed off */
  .sheet .what::after {
    content: ''; position: absolute; left: -2px; right: -2px; top: 52%;
    height: 2px; background: currentColor;
    transform: scaleX(0); transform-origin: left center;
    transition: transform .4s steps(14);
  }
  .sheet li.done .what::after { transform: scaleX(1); }

  .foot { flex: none; padding: 8px 14px 10px; border-top: 3px solid rgba(0,0,0,.18); text-align: center; }
  .foot button { margin: 0; }
  #card .go {
    background: #2a2418; color: #f2e9d2;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.18);
  }

  /* ---- win --------------------------------------------------------------- */
  #win h1 { font-size: 18px; line-height: 1.7; margin: 0; color: var(--gold); text-shadow: 3px 3px 0 #8a6a34; }
  #win .love { color: var(--pink); font-size: 26px; }
  #win .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }

  /* floating hearts on the win screen */
  .heart {
    position: absolute; z-index: 0; width: 4px; height: 4px; background: var(--pink);
    box-shadow:
      -4px -4px 0 var(--pink), 4px -4px 0 var(--pink),
      -8px 0 0 var(--pink), -4px 0 0 var(--pink), 4px 0 0 var(--pink), 8px 0 0 var(--pink),
      -8px 4px 0 var(--pink), -4px 4px 0 var(--pink), 4px 4px 0 var(--pink), 8px 4px 0 var(--pink),
      -4px 8px 0 var(--pink), 4px 8px 0 var(--pink),
      0 4px 0 var(--pink), 0 8px 0 var(--pink), 0 12px 0 var(--pink);
    animation: float linear infinite;
    pointer-events: none;
  }
  @keyframes float { from { transform: translateY(110%); } to { transform: translateY(-40px); } }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
    .sheet li, .sheet .box, .sheet .tick, .sheet .stamp, .sheet .what::after { transition: none; }
  }
</style>

<div id="shell">
  <canvas id="game" width="240" height="232" aria-label="Fall Trip: walk through each stop on the itinerary"></canvas>

  <div id="card" class="overlay" hidden>
    <div class="band"><span>THE FALL TRIP</span><span id="cardnum">STOP 1 / 9</span></div>
    <div class="sheet" id="cardlist"></div>
    <div class="foot"><button class="go" type="button" id="cardgo">LET'S GO</button></div>
  </div>

  <div id="win" class="overlay" hidden>
    <h1 class="display">2026<br>FALL TRIP</h1>
    <p class="love">I love you, Baby Bee.</p>
    <div class="row">
      <button type="button" id="seetrip">THE WHOLE TRIP</button>
      <button class="ghost again" type="button">play again</button>
    </div>
  </div>

  <div id="trip" class="overlay" hidden>
    <div class="band"><span>THE FALL TRIP</span><span>2 DAYS</span></div>
    <div class="sheet" id="tripbody"></div>
    <div class="foot"><button type="button" id="tripback">BACK</button></div>
  </div>
</div>

<div id="pad" aria-label="Direction pad">

  <button class="right" data-dir="right" aria-label="Right">&#9654;</button>
  <button class="down" data-dir="down" aria-label="Down">&#9660;</button>
</div>

  function makeSprite(rows, override) {
    const c = document.createElement('canvas');
    c.width = rows[0].length; c.height = rows.length;
    const g = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, x) => {
      if (ch === '.') return;
      g.fillStyle = (override && override[ch]) || PAL[ch] || '#ff00ff';
      g.fillRect(x, y, 1, 1);
    }));
    return c;
  }

  // deterministic per-tile noise, so speckles stay put between frames
  function hash(x, y) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function speckle(X, Y, x, y, n, sa, sb, salt) {
    for (let i = 0; i < n; i++) {
      const r = hash(x * salt + i, y * (salt + 6) + i * 5);
      ctx.fillStyle = r > 0.5 ? sa : sb;
      ctx.fillRect(X + Math.floor(r * 14), Y + Math.floor((r * 911 % 1) * 14), 2, 2);
    }
  }

  const GROUND = {
    grass(X, Y, x, y) {
      ctx.fillStyle = '#3c5a32'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 6, '#47683b', '#34502c', 13);
    },
    grasswall(X, Y, x, y) {
      ctx.fillStyle = '#35502c'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 8, '#41603a', '#2b4223', 23);
    },
    dirt(X, Y, x, y) {
      ctx.fillStyle = '#6b563c'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 6, '#7a6449', '#5c4a33', 19);
    },
    gravel(X, Y, x, y) {
      ctx.fillStyle = '#4a4640'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 7, '#565149', '#3e3a35', 17);
    },
    road(X, Y, x, y) {
      ctx.fillStyle = '#2b2b33'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 4, '#32323b', '#26262d', 7);
      const paved = (ax, ay) => { const k = kindAt(ax, ay); return k === 'road' || k === 'lane' || k === 'exit'; };
      ctx.fillStyle = '#d8d2c4';
      if (!paved(x - 1, y)) ctx.fillRect(X + 1, Y, 1, TILE);
      if (!paved(x + 1, y)) ctx.fillRect(X + TILE - 2, Y, 1, TILE);
    },
    lane(X, Y, x, y) {
      GROUND.road(X, Y, x, y);
      ctx.fillStyle = '#e8c04a'; ctx.fillRect(X + 7, Y + 2, 2, 12);
    },
    bridge(X, Y, x, y) {
      ctx.fillStyle = '#7a5a38'; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = '#5f462b';
      for (let i = 0; i < TILE; i += 4) ctx.fillRect(X, Y + i, TILE, 1);
      ctx.fillStyle = '#9a744a'; ctx.fillRect(X, Y, 2, TILE); ctx.fillRect(X + TILE - 2, Y, 2, TILE);
    },
    water(X, Y, x, y) {
      ctx.fillStyle = '#2d5a7a'; ctx.fillRect(X, Y, TILE, TILE);
      const w = Math.sin(state.t * 2 + x * 0.7 + y * 1.1);
      ctx.fillStyle = '#3d7096'; ctx.fillRect(X, Y + 4 + Math.round(w * 1.5), TILE, 2);
      ctx.fillStyle = '#4f88b0'; ctx.fillRect(X, Y + 11 - Math.round(w * 1.5), TILE, 1);
    },
    falls(X, Y, x, y) {
      ctx.fillStyle = '#4a7ba0'; ctx.fillRect(X, Y, TILE, TILE);
      for (let i = 0; i < 4; i++) {
        const off = (state.t * 46 + i * 37 + x * 13) % 16;
        ctx.fillStyle = i % 2 ? '#cfe8ff' : '#9fc8e8';
        ctx.fillRect(X + 2 + i * 4, Y + off, 2, 6);
        ctx.fillRect(X + 2 + i * 4, Y + off - 16, 2, 6);
      }
    },
    cliff(X, Y, x, y) {
      ctx.fillStyle = '#6a665e'; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = '#7d786e'; ctx.fillRect(X, Y, TILE, 2);
      speckle(X, Y, x, y, 5, '#55524b', '#5e5b53', 31);
      ctx.fillStyle = '#46443e'; ctx.fillRect(X, Y + TILE - 2, TILE, 2);
    },
    street(X, Y, x, y) {
      ctx.fillStyle = '#34343d'; ctx.fillRect(X, Y, TILE, TILE);
      speckle(X, Y, x, y, 4, '#3c3c46', '#2d2d36', 11);
    },
    sidewalk(X, Y, x, y) {
      ctx.fillStyle = '#b4afa2'; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = '#a29d90'; ctx.fillRect(X, Y + TILE - 1, TILE, 1); ctx.fillRect(X + TILE - 1, Y, 1, TILE);
      speckle(X, Y, x, y, 3, '#bdb8ab', '#aaa598', 29);
    },
    // ---- the building a stop is named after --------------------------------
    roof(X, Y, x, y) {
      const b = state.L.building;
      ctx.fillStyle = b.roof; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = b.roofDark;
      for (let i = 4; i < TILE; i += 5) ctx.fillRect(X, Y + i, TILE, 1);
      ctx.fillStyle = b.trim; ctx.fillRect(X, Y, TILE, 2);
      ctx.fillStyle = b.roofDark; ctx.fillRect(X, Y + TILE - 2, TILE, 2);
    },
    facade(X, Y, x, y) {
      const b = state.L.building;
      ctx.fillStyle = b.wall; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = b.wallDark;
      for (let i = 3; i < TILE; i += 4) ctx.fillRect(X, Y + i, TILE, 1);
      ctx.fillStyle = b.wallLight; ctx.fillRect(X, Y, TILE, 1);
    },
    window(X, Y, x, y) {
      GROUND.facade(X, Y, x, y);
      const b = state.L.building;
      ctx.fillStyle = b.trim; ctx.fillRect(X + 1, Y + 2, TILE - 2, TILE - 5);
      ctx.fillStyle = b.glass; ctx.fillRect(X + 2, Y + 3, TILE - 4, TILE - 7);
      ctx.fillStyle = b.trim;
      ctx.fillRect(X + 7, Y + 3, 1, TILE - 7);
      ctx.fillRect(X + 2, Y + 7, TILE - 4, 1);
    },
    sign(X, Y, x, y) {
      GROUND.facade(X, Y, x, y);
      const b = state.L.building;
      ctx.fillStyle = b.signInk; ctx.fillRect(X, Y + 2, TILE, TILE - 5);
      ctx.fillStyle = b.sign; ctx.fillRect(X, Y + 3, TILE, TILE - 7);
    },
    door(X, Y, x, y) {
      GROUND.facade(X, Y, x, y);
      const b = state.L.building;
      ctx.fillStyle = b.doorDark; ctx.fillRect(X + 1, Y + 1, TILE - 2, TILE - 1);
      ctx.fillStyle = b.door; ctx.fillRect(X + 2, Y + 2, TILE - 4, TILE - 2);
      ctx.fillStyle = b.doorDark; ctx.fillRect(X + 3, Y + 4, TILE - 6, 4);
      ctx.fillStyle = b.trim; ctx.fillRect(X + TILE - 5, Y + 9, 2, 2);
      // the way in pulses as a frame around the door, not a wash over it, so
      // the door keeps its own colour
      const pulse = 0.5 + 0.5 * Math.sin(state.t * 5);
      ctx.globalAlpha = 0.35 + 0.45 * pulse;
      ctx.fillStyle = state.L.theme.accent;
      ctx.fillRect(X, Y, TILE, 2);
      ctx.fillRect(X, Y, 2, TILE);
      ctx.fillRect(X + TILE - 2, Y, 2, TILE);
      ctx.globalAlpha = 1;
    },
    // Seen from the chair: the tops of the trees, and a long way down.
    // The dark understory is laid down for the whole scene first (see prepass),
    // so these crowns may spill across tile edges without being painted out.
    // Confining each crown to its own tile made a polka-dot grid, not a forest.
    canopyBase(X, Y) {
      ctx.fillStyle = '#16210f'; ctx.fillRect(X, Y, TILE, TILE);
    },
    canopy(X, Y, x, y) {
      for (let i = 0; i < 2; i++) {
        const r = hash(x * 13 + i * 7, y * 7 + i * 11);
        const s = hash(x * 29 + i * 3, y * 19 + i * 5);
        const tone = r < 0.36 ? ['#b8501f', '#d97a2c']
                   : r < 0.68 ? ['#c99320', '#e8bb45']
                   : ['#3c6b36', '#4d8544'];
        const rad = 4 + Math.floor(s * 4);
        const cx = X + 2 + Math.floor(r * 13), cy = Y + 2 + Math.floor(s * 13);
        ctx.fillStyle = tone[0];
        ctx.fillRect(cx - rad, cy - rad + 2, rad * 2, rad * 2 - 3);
        ctx.fillRect(cx - rad + 2, cy - rad, rad * 2 - 3, rad * 2);
        ctx.fillStyle = tone[1];
        ctx.fillRect(cx - rad + 1, cy - rad + 2, rad, rad);
        ctx.fillStyle = 'rgba(0,0,0,0.20)';
        ctx.fillRect(cx + 1, cy + 1, rad, rad);
      }
    },
    cable(X, Y, x, y) { GROUND.canopy(X, Y, x, y); },
    tower(X, Y, x, y) { GROUND.canopy(X, Y, x, y); },
    downline(X, Y, x, y) { GROUND.canopy(X, Y, x, y); },
    downchair(X, Y, x, y) { GROUND.canopy(X, Y, x, y); },
    platform(X, Y, x, y) {
      ctx.fillStyle = '#7a5a38'; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = '#5f462b';
      for (let i = 0; i < TILE; i += 4) ctx.fillRect(X, Y + i, TILE, 1);
      ctx.fillStyle = '#9a744a'; ctx.fillRect(X, Y, TILE, 2);
    },
    station(X, Y, x, y) {
      ctx.fillStyle = '#4a4a52'; ctx.fillRect(X, Y, TILE, TILE);
      ctx.fillStyle = '#62626c'; ctx.fillRect(X, Y, TILE, 3);
      ctx.fillStyle = '#383840';
      for (let i = 5; i < TILE; i += 4) ctx.fillRect(X, Y + i, TILE, 1);
      ctx.fillStyle = '#2c2c33'; ctx.fillRect(X, Y + TILE - 2, TILE, 2);
    },
  };
  // Drawn after every tile is down, so a neighbouring tree crown cannot break
  // the haul rope in half.
  const OVERLAY = {
    cable(X, Y) {
      ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fillRect(X + 10, Y, 2, TILE);
      ctx.fillStyle = '#9aa0a8'; ctx.fillRect(X + 7, Y, 2, TILE);
    },
    tower(X, Y) {
      OVERLAY.cable(X, Y);
      ctx.fillStyle = '#4e535a'; ctx.fillRect(X + 6, Y, 4, TILE);
      ctx.fillStyle = '#6a6f78'; ctx.fillRect(X + 1, Y + 6, 14, 3);
      ctx.fillStyle = '#9aa0a8';
      ctx.fillRect(X + 1, Y + 5, 2, 2); ctx.fillRect(X + 13, Y + 5, 2, 2);
    },
    downline(X, Y) {
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(X + 10, Y, 2, TILE);
      ctx.fillStyle = '#868c94'; ctx.fillRect(X + 7, Y, 2, TILE);
    },
    downchair(X, Y) {
      OVERLAY.downline(X, Y);
      ctx.fillStyle = '#4e535a'; ctx.fillRect(X + 7, Y, 2, 6);
      ctx.fillStyle = '#2f5a8a'; ctx.fillRect(X + 3, Y + 5, 10, 5);
      ctx.fillStyle = '#1e3f63'; ctx.fillRect(X + 3, Y + 10, 10, 2);
    },
  };
  // solid: the scenery props, plus the full-tile kinds you cannot walk on
  const SOLID = new Set(['grasswall', 'water', 'falls', 'cliff', 'him', 'canopy', 'downline', 'downchair', 'station',
    'roof', 'facade', 'window', 'sign'].concat(Object.keys(PROPS)));

  // ---- state --------------------------------------------------------------
  const SPEED = 5;   // a stroll, not a sprint: there is scenery to look at
  const SAVE = 'falltrip.progress';
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  const state = {
    screen: 'title', li: 0, L: LEVELS[0], map: LEVELS[0].map,
    px: 0, py: 0, tx: 0, ty: 0, prog: 1, dir: 'down', frame: 0, t: 0,
    banner: null, cut: null, advancing: false,
    goal: { x: 0, y: 0 }, exitDir: 'up', himPos: null, signBox: null,
    comp: null, trail: [], popups: [],
  };
  const held = new Set();
  let queued = null, swipeDir = null;

  const loadProgress = () => { try { return Math.min(LEVELS.length, Math.max(0, +localStorage.getItem(SAVE) || 0)); } catch (e) { return 0; } };
  const saveProgress = (n) => { try { localStorage.setItem(SAVE, String(n)); } catch (e) {} };
  const clearProgress = () => { try { localStorage.removeItem(SAVE); } catch (e) {} };

  const at = (x, y) => (y < 0 || y >= ROWS || x < 0 || x >= COLS) ? '#' : state.map[y][x];
  function kindAt(x, y) {
    const L = state.L, ch = at(x, y);
    if (ch === '#') return L.tiles['#'] || 'cliff';
    if (ch === 'X') return L.exitKind || 'exit';
    if (ch === 'M') return 'him';
    if (ch === '@') return L.tiles['@'] || L.base;
    return L.tiles[ch] || L.base;
  }
  const solid = (x, y) => SOLID.has(kindAt(x, y));

  function findPath(from, to) {
    const key = (x, y) => y * COLS + x;
    const prev = new Map([[key(from.x, from.y), null]]);
    const q = [from];
    for (let i = 0; i < q.length; i++) {
      const c = q[i];
      if (c.x === to.x && c.y === to.y) break;
      for (const k in DIRS) {
        const n = { x: c.x + DIRS[k][0], y: c.y + DIRS[k][1] };
        if (n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS) continue;
        if (solid(n.x, n.y) || prev.has(key(n.x, n.y))) continue;
        prev.set(key(n.x, n.y), c); q.push(n);
      }
    }
    if (!prev.has(key(to.x, to.y))) return [];
    const path = [];
    for (let c = to; c && !(c.x === from.x && c.y === from.y); c = prev.get(key(c.x, c.y))) path.unshift(c);
    return path;
  }

  function loadLevel(i) {
    const L = LEVELS[i];
    state.li = i; state.L = L; state.map = L.map;
    state.prog = 1; state.dir = L.companion === 'car' ? 'up' : 'up';
    state.frame = 0; state.banner = null; state.cut = null;
    state.advancing = false; state.trail = []; state.popups = [];
    state.himPos = null; state.comp = null; state.signBox = null;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const ch = L.map[y][x];
      if (ch === '@') { state.px = state.tx = x; state.py = state.ty = y; }
      else if (ch === 'X') state.goal = { x, y };
      else if (ch === 'M') { state.himPos = { x, y }; state.goal = { x, y }; }
    }
    if (L.signText) {
      let x0 = 99, x1 = -1, sy = -1;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if ((L.tiles[L.map[y][x]] || '') === 'sign') { x0 = Math.min(x0, x); x1 = Math.max(x1, x); sy = y; }
      }
      if (sy >= 0) state.signBox = { x0, x1, y: sy };
    }
    // which way the exit faces, for the marker chevron
    const g = state.goal;
    state.exitDir = g.y <= 1 ? 'up' : g.y >= ROWS - 2 ? 'down' : g.x >= COLS - 2 ? 'right' : 'left';
    if (L.companion === 'follow') {
      const s = companionStart();
      state.comp = { px: s.x, py: s.y, tx: s.x, ty: s.y, prog: 1, frame: 0 };
    }
    held.clear(); queued = null; swipeDir = null;
    document.documentElement.style.setProperty('--accent', L.theme.accent);
    document.getElementById('shell').style.borderColor = L.theme.accent;
  }
  // he starts a step behind her, on whatever open tile is nearest the start
  function companionStart() {
    for (const d of ['down', 'left', 'right', 'up']) {
      const x = state.tx + DIRS[d][0], y = state.ty + DIRS[d][1];
      if (!solid(x, y)) return { x, y };
    }
    return { x: state.tx, y: state.ty };
  }

  // ---- movement -----------------------------------------------------------
  function wantDir() {
    if (queued) { const d = queued; queued = null; return d; }
    for (const d of ['up', 'down', 'left', 'right']) if (held.has(d)) return d;
    return swipeDir;
  }
  function tryMove(d) {
    const [dx, dy] = DIRS[d];
    state.dir = d;
    if (solid(state.tx + dx, state.ty + dy)) { if (d === swipeDir) swipeDir = null; return false; }
    state.trail.push({ x: state.tx, y: state.ty });
    state.px = state.tx; state.py = state.ty;
    state.tx += dx; state.ty += dy; state.prog = 0;
    return true;
  }
  function stepWalk(dt) {
    if (state.prog < 1) { state.prog = Math.min(1, state.prog + dt * SPEED); return state.prog === 1; }
    return false;
  }
  // he walks the tiles she has already left, a step or two back
  function updateCompanion(dt) {
    const c = state.comp;
    if (!c) { if (state.trail.length > 3) state.trail.shift(); return; }
    if (c.prog < 1) c.prog = Math.min(1, c.prog + dt * SPEED);
    if (c.prog >= 1 && state.trail.length >= 2) {
      const n = state.trail.shift();
      c.px = c.tx; c.py = c.ty; c.tx = n.x; c.ty = n.y; c.prog = 0; c.frame ^= 1;
    }
  }
  function arrive() {
    if (state.L.finale) {
      const h = state.himPos;
      if (h && Math.abs(h.x - state.tx) + Math.abs(h.y - state.ty) <= 1) beginCutscene();
      return;
    }
    const k = kindAt(state.tx, state.ty);
    if (k === 'exit' || k === 'door') completeLevel();
  }
  function updatePlay(dt) {
    if (stepWalk(dt)) arrive();
    if (state.screen !== 'play') return;
    if (state.prog >= 1) {
      const d = wantDir();
      if (d && tryMove(d)) state.frame ^= 1;
    }
    updateCompanion(dt);
  }

  // ---- audio (tiny chiptune) ---------------------------------------------
  let ac = null;
  function beep(freq, dur, t0 = 0, type = 'square', vol = 0.08) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.02);
  }
  function unlockAudio() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  const sfx = {
    start: () => { beep(440, 0.08); beep(660, 0.12, 0.09); },
    stop: () => [523, 659, 784].forEach((f, i) => beep(f, 0.16, i * 0.11)),
    hug: () => { beep(523, 0.6, 0, 'triangle', 0.06); beep(659, 0.6, 0.02, 'triangle', 0.06); beep(784, 0.6, 0.04, 'triangle', 0.06); },
    win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, i === 6 ? 0.5 : 0.14, i * 0.13)),
  };

  // ---- screens ------------------------------------------------------------
  const el = (id) => document.getElementById(id);
  const hideAll = () => ['card', 'win', 'trip'].forEach((k) => { el(k).hidden = true; });

  function setHint() {
    const h = el('hint');
    if (state.screen === 'title') {
      const p = loadProgress();
      h.innerHTML = p > 0 && p < LEVELS.length
        ? 'Picking up at stop ' + (p + 1) + ' of ' + LEVELS.length + '.'
        : 'Arrow keys, swipe, or the pad.';
      if (p > 0) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = 'start over';
        b.addEventListener('click', () => { clearProgress(); setHint(); });
        h.append(' ', b);
      }
      return;
    }
    // on the checklist the line under the pad belongs to the stop she is about
    // to walk, not the one she just finished
    h.textContent = state.screen === 'card' ? LEVELS[state.li].hint : state.L.hint;
  }

  // ---- the checklist ------------------------------------------------------
  // One line per stop, built from the levels so it can never drift from them.
  // It is the whole between-stops screen: the stop she just walked gets crossed
  // off while she watches, and the next line lights up.
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TRIP_ROWS = [];
  LEVELS.forEach((L, i) => {
    if (L.short === "JOSIE'S") TRIP_ROWS.push({ at: i, day: 2, when: '8:00 AM', title: 'Wake up' });
    TRIP_ROWS.push({ at: i, day: L.day, when: L.when, title: L.title, stamp: L.stamp });
  });

  function buildChecklist(host) {
    const rows = [];
    let day = 0, ol = null;
    for (const r of TRIP_ROWS) {
      if (r.day !== day) {
        day = r.day;
        const h = document.createElement('p');
        h.className = 'day';
        h.textContent = day === 1 ? 'DAY ONE' : 'DAY TWO';
        ol = document.createElement('ol');
        host.append(h, ol);
      }
      const li = document.createElement('li');
      const mark = document.createElement('span'); mark.className = 'mark';
      const box = document.createElement('i'); box.className = 'box';
      const tick = document.createElement('i'); tick.className = 'tick';
      box.appendChild(tick);
      mark.appendChild(box);
      if (r.stamp) {
        const c = document.createElement('canvas');
        c.className = 'stamp'; c.width = 16; c.height = 16;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.drawImage(spr.stamp[r.stamp], 0, 0);
        mark.appendChild(c);
      }
      const when = document.createElement('b'); when.className = 'when'; when.textContent = r.when;
      const what = document.createElement('span'); what.className = 'what'; what.textContent = r.title;
      li.append(mark, when, what);
      ol.appendChild(li);
      rows.push({ line: li, r });
    }
    return rows;
  }

  // done: how many stops are behind us. now: the stop she is about to walk,
  // or -1 at the end of the trip, when every line is crossed off.
  function markChecklist(rows, done, now) {
    for (const { line, r } of rows) {
      line.classList.toggle('done', r.stamp ? r.at < done : r.at <= done);
      line.classList.toggle('now', !!r.stamp && r.at === now);
    }
  }
  // only when the line is out of sight: a sheet that fits stays put, day
  // headings and all
  function scrollToNow(host, rows, smooth) {
    const row = rows.find(({ line }) => line.classList.contains('now'));
    if (!row) return;
    const top = row.line.offsetTop, bottom = top + row.line.offsetHeight;
    if (top >= host.scrollTop + 8 && bottom <= host.scrollTop + host.clientHeight - 8) return;
    host.scrollTo({
      top: Math.max(0, top - (host.clientHeight - row.line.offsetHeight) / 2),
      behavior: smooth && !REDUCED ? 'smooth' : 'auto',
    });
  }

  const cardRows = buildChecklist(el('cardlist'));
  const tripRows = buildChecklist(el('tripbody'));
  markChecklist(tripRows, LEVELS.length, -1);

  // crossing: she just finished the stop before this one, so the sheet opens as
  // it stood and that line is struck through in front of her.
  let crossTimer = 0;
  function showCard(i, crossing) {
    const L = LEVELS[i];
    state.li = i; state.screen = 'card';
    document.documentElement.style.setProperty('--accent', L.theme.accent);
    el('cardnum').textContent = 'STOP ' + (i + 1) + ' / ' + LEVELS.length;
    clearTimeout(crossTimer);
    const at = crossing ? i - 1 : i;
    markChecklist(cardRows, at, at);
    hideAll();
    setHint();
    el('card').hidden = false;
    scrollToNow(el('cardlist'), cardRows, false);
    el('cardgo').focus({ preventScroll: true });
    if (crossing) {
      crossTimer = setTimeout(() => {
        markChecklist(cardRows, i, i);
        scrollToNow(el('cardlist'), cardRows, true);
      }, 450);
    }
  }

  function beginLevel(i) {
    unlockAudio();
    hideAll();
    loadLevel(i);
    state.screen = 'play';
    setHint();
    state.banner = { lines: LEVELS[i].banner, t: 0, dur: 3 };
    sfx.start();
  }
  function startTitle() {
    state.screen = 'title'; state.L = LEVELS[0]; state.map = LEVELS[0].map;
    hideAll();
    document.documentElement.style.setProperty('--accent', '#f0c060');
    document.getElementById('shell').style.borderColor = 'var(--cream-shade)';
    setHint();
  }
  function completeLevel() {
    if (state.advancing) return;
    state.advancing = true;
    state.screen = 'done';
    saveProgress(state.li + 1);
    sfx.stop();
    setTimeout(() => showCard(state.li + 1, true), 800);
  }

  // ---- the finale: she crosses to him, they hug, then the trip ------------
  function beginCutscene() {
    state.screen = 'cutscene';
    held.clear(); queued = null; swipeDir = null;
    const target = { x: state.himPos.x - 1, y: state.himPos.y };
    state.cut = { path: findPath({ x: state.tx, y: state.ty }, target), phase: 'walk', t: 0, hugT: 0 };
  }
  function updateCutscene(dt) {
    const c = state.cut;
    c.t += dt;
    if (c.phase === 'walk') {
      stepWalk(dt);
      updateCompanion(dt);
      if (state.prog >= 1) {
        if (c.path.length) {
          const n = c.path.shift();
          const d = n.x > state.tx ? 'right' : n.x < state.tx ? 'left' : n.y > state.ty ? 'down' : 'up';
          tryMove(d); state.frame ^= 1;
        } else { c.phase = 'pause'; c.t = 0; state.dir = 'right'; }
      }
    } else if (c.phase === 'pause') {
      if (c.t > 0.5) { c.phase = 'hug'; c.t = 0; sfx.hug(); }
    } else if (c.phase === 'hug') {
      c.hugT = Math.min(1, c.t / 0.5);
      if (c.t > 0.3 && Math.floor(c.t * 6) !== Math.floor((c.t - dt) * 6) && c.t < 2.4) {
        state.popups.push({ x: state.himPos.x - 0.5 + (Math.random() - 0.5), y: state.himPos.y - 0.3 - Math.random() * 0.4, t: 0 });
      }
      if (c.t > 3.2) win();
    }
  }
  function win() {
    state.screen = 'win';
    saveProgress(LEVELS.length);
    sfx.win();
    const overlay = el('win');
    hideAll();
    overlay.hidden = false;
    overlay.querySelectorAll('.heart').forEach((h) => h.remove());
    for (let i = 0; i < 9; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.style.left = (6 + Math.random() * 88) + '%';
      h.style.animationDuration = (4 + Math.random() * 4) + 's';
      h.style.animationDelay = (-Math.random() * 6) + 's';
      h.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
      overlay.appendChild(h);
    }
  }

  function update(dt) {
    state.t += dt;
    if (state.banner && (state.banner.t += dt) > state.banner.dur) state.banner = null;
    state.popups = state.popups.filter((p) => (p.t += dt) < 0.7);
    if (state.screen === 'play') updatePlay(dt);
    else if (state.screen === 'cutscene') updateCutscene(dt);
    else if (state.screen === 'done') { stepWalk(dt); updateCompanion(dt); }
  }

  // ---- render -------------------------------------------------------------
  const CHEV = {
    up: [[7, 3], [5, 5], [9, 5], [3, 7], [11, 7]],
    down: [[7, 12], [5, 10], [9, 10], [3, 8], [11, 8]],
    left: [[3, 7], [5, 5], [5, 9], [7, 3], [7, 11]],
    right: [[12, 7], [10, 5], [10, 9], [8, 3], [8, 11]],
  };
  function drawExit(X, Y) {
    const pulse = 0.5 + 0.5 * Math.sin(state.t * 5);
    ctx.globalAlpha = 0.30 + 0.35 * pulse;
    ctx.fillStyle = state.L.theme.accent;
    ctx.fillRect(X + 1, Y + 1, TILE - 2, TILE - 2);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff8e8';
    for (const [dx, dy] of CHEV[state.exitDir]) ctx.fillRect(X + dx, Y + dy, 2, 2);
  }
  function drawScene() {
    const L = state.L;
    // a scene can lay one ground under everything before the tiles go down, so
    // tiles that overflow their bounds are not clipped by their neighbours
    if (L.prepass) {
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) GROUND[L.prepass](x * TILE, HUD + y * TILE, x, y);
    }
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const X = x * TILE, Y = HUD + y * TILE;
      const k = kindAt(x, y);
      if (k === 'exit') { GROUND[L.exitBase || L.base](X, Y, x, y); drawExit(X, Y); continue; }
      if (k === 'door') { GROUND.door(X, Y, x, y); continue; }
      if (k === 'him') { GROUND[L.objectBase](X, Y, x, y); continue; }
      if (GROUND[k]) { GROUND[k](X, Y, x, y); continue; }
      // a prop can name the ground it stands on, so a tree gets grass under it
      // while a parked car in the same scene gets asphalt
      const base = (L.propBase && L.propBase[state.map[y][x]]) || L.objectBase;
      GROUND[base](X, Y, x, y);
      ctx.drawImage(spr.prop[k], X, Y - 4);
    }
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const o = OVERLAY[kindAt(x, y)];
      if (o) o(x * TILE, HUD + y * TILE);
    }
    drawSign();
  }
  // the shop's name, sized to fit whatever run of sign tiles it was given
  function drawSign() {
    const L = state.L, s = state.signBox;
    if (!s || !L.signText) return;
    const avail = (s.x1 - s.x0 + 1) * TILE - 4;
    const size = Math.max(5, Math.min(8, Math.floor(avail / L.signText.length)));
    ctx.font = size + 'px "Press Start 2P", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = L.building.signInk;
    ctx.fillText(L.signText, (s.x0 + s.x1 + 1) * TILE / 2, HUD + s.y * TILE + 8);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }
  function shadow(x, y) {
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(Math.round(x) + 4, Math.round(y) + 14, 8, 2);
  }
  // actors are painted back to front so whoever stands lower overlaps
  function drawActors() {
    const L = state.L, hugging = state.cut && state.cut.phase === 'hug';
    const acts = [];
    const sx = (state.px + (state.tx - state.px) * state.prog) * TILE;
    const sy = (state.py + (state.ty - state.py) * state.prog) * TILE + HUD;

    if (L.companion === 'car') {
      const v = L.vehicle || 'car';
      const off = v === 'chair' ? [-2, -4] : [-4, -5];
      acts.push({ y: sy, draw: () => {
        if (v === 'chair') {
          // the chair's shadow falls on the canopy well below and behind it
          ctx.fillStyle = 'rgba(0,0,0,0.30)';
          ctx.fillRect(Math.round(sx) - 1, Math.round(sy) + 15, 14, 7);
          ctx.fillRect(Math.round(sx) + 1, Math.round(sy) + 13, 10, 11);
        } else shadow(sx, sy + 2);
        ctx.drawImage(spr[v], Math.round(sx) + off[0], Math.round(sy) + off[1]);
      } });
    } else {
      acts.push({ y: sy, draw: () => {
        let x = sx;
        if (hugging) x += Math.round(state.cut.hugT * 5);
        shadow(x, sy);
        ctx.drawImage(hugging ? spr.shellyHug : spr.shelly[state.prog < 1 ? state.frame : 0], Math.round(x), Math.round(sy) - 5);
      } });
    }
    if (state.comp) {
      const c = state.comp;
      const cx = (c.px + (c.tx - c.px) * c.prog) * TILE;
      const cy = (c.py + (c.ty - c.py) * c.prog) * TILE + HUD;
      acts.push({ y: cy, draw: () => { shadow(cx, cy); ctx.drawImage(spr.him[c.prog < 1 ? c.frame : 0], Math.round(cx), Math.round(cy) - 7); } });
    }
    if (state.himPos) {
      const hx = state.himPos.x * TILE - (hugging ? Math.round(state.cut.hugT * 4) : 0);
      const hy = HUD + state.himPos.y * TILE;
      acts.push({ y: hy, draw: () => {
        shadow(hx, hy);
        if (hugging) ctx.drawImage(spr.himHug, hx, hy - 7);
        else {
          const hop = state.screen === 'play' ? -Math.abs(Math.round(Math.sin(state.t * 4) * 1.2)) : 0;
          ctx.drawImage(spr.him[0], hx, hy - 7 + hop);
        }
      } });
    }
    acts.sort((a, b) => a.y - b.y).forEach((a) => a.draw());

    for (const p of state.popups) {
      const y = HUD + p.y * TILE - 4 - p.t * 18;
      ctx.globalAlpha = 1 - p.t / 0.7;
      ctx.drawImage(spr.heartBig, Math.round(p.x * TILE) + 4, Math.round(y));
      ctx.globalAlpha = 1;
    }
  }
  function warmGlow(cx, cy, r, a) {
    const g = ctx.createRadialGradient(cx, cy, 1, cx, cy, r);
    g.addColorStop(0, 'rgba(255,196,120,' + a + ')');
    g.addColorStop(1, 'rgba(255,196,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  function drawHUD() {
    const L = state.L;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(0, 0, cv.width, HUD);
    ctx.fillStyle = L.theme.accent; ctx.fillRect(0, HUD - 2, cv.width, 2);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = L.theme.accent; ctx.fillText((state.li + 1) + '/' + LEVELS.length, 4, 8);
    ctx.fillStyle = '#f4efe2'; ctx.fillText(L.short, 32, 8);
    // a chevron on the right pointing the way on
    const gx = state.goal.x - state.tx, gy = state.goal.y - state.ty;
    const d = Math.abs(gx) > Math.abs(gy) ? (gx > 0 ? 'right' : 'left') : (gy > 0 ? 'down' : 'up');
    const bx = cv.width - 20, by = 4;
    ctx.globalAlpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(state.t * 4));
    ctx.fillStyle = L.theme.accent;
    for (const [dx, dy] of CHEV[d]) ctx.fillRect(bx + dx, by + dy, 2, 2);
    ctx.globalAlpha = 1;
  }
  function drawBanner() {
    if (!state.banner) return;
    const { lines, t, dur } = state.banner;
    const a = Math.min(1, t * 4, (dur - t) * 2);
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = '8px "Press Start 2P", monospace';
    const w = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16;
    const h = lines.length * 12 + 10;
    const X = Math.round(cv.width / 2 - w / 2), Y = HUD + 6 * TILE - Math.round(h / 2) + 8;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(X, Y, w, h);
    ctx.fillStyle = state.L.theme.accent;
    ctx.fillRect(X, Y, w, 2); ctx.fillRect(X, Y + h - 2, w, 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = state.L.theme.accent;
    lines.forEach((l, i) => ctx.fillText(l, cv.width / 2, Y + 7 + i * 12));
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  function drawTitle() {
    const cx = cv.width / 2;
    ctx.fillStyle = '#0d0f1e'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let x = 0; x < COLS; x++) GROUND.road(x * TILE, 168, x, 9);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillStyle = '#8a6a34'; ctx.fillText('FALL TRIP', cx + 2, 36);
    ctx.fillStyle = '#f0c060'; ctx.fillText('FALL TRIP', cx, 34);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillStyle = '#9aa0b8'; ctx.fillText('THE CATSKILLS', cx, 62);
    ctx.fillStyle = '#f4efe2';
    ctx.fillText('ITINERARY', cx, 88);
    const bob = Math.round(Math.sin(state.t * 3) * 2);
    ctx.drawImage(spr.car, cx - 8, 120 + bob);
    ctx.drawImage(spr.shelly[Math.floor(state.t * 3) % 2], 48, 164);
    ctx.drawImage(spr.him[Math.floor(state.t * 3) % 2], 168, 161);
    const p = loadProgress();
    if (Math.floor(state.t * 2) % 2 === 0) {
      ctx.fillStyle = '#f0c060';
      ctx.fillText(p > 0 && p < LEVELS.length ? 'TAP TO CONTINUE' : 'TAP TO START', cx, 200);
    }
    if (p > 0 && p < LEVELS.length) {
      ctx.fillStyle = '#9aa0b8';
      ctx.fillText('STOP ' + (p + 1) + ' OF ' + LEVELS.length, cx, 214);
    }
    ctx.textAlign = 'left';
  }
  function render() {
    if (state.screen === 'title') { drawTitle(); return; }
    drawScene();
    drawActors();
    const L = state.L;
    if (L.theme.ambient) {
      ctx.fillStyle = L.theme.ambient;
      ctx.fillRect(0, HUD, cv.width, cv.height - HUD);
    }
    // warm light goes on top of the hour's wash: lamps, candles, headlights
    if (L.glow || L.headlights) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      if (L.glow) for (const g of L.glow) warmGlow(g.x * TILE + 8, HUD + g.y * TILE + 8, g.r, 0.26);
      if (L.headlights) {
        const hx = (state.px + (state.tx - state.px) * state.prog) * TILE + 8;
        const hy = (state.py + (state.ty - state.py) * state.prog) * TILE + HUD + 8;
        const d = DIRS[state.dir] || [0, -1];
        warmGlow(hx + d[0] * 18, hy + d[1] * 18, 34, 0.30);
      }
      ctx.restore();
    }
    drawHUD();
    drawBanner();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  // ---- input --------------------------------------------------------------
  function startFromProgress() {
    unlockAudio();
    const p = loadProgress();
    if (p >= LEVELS.length) { clearProgress(); showCard(0); } else showCard(p);
  }
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  addEventListener('keydown', (e) => {
    const d = KEYS[e.key];
    if (state.screen === 'title' && (d || e.key === ' ' || e.key === 'Enter')) { startFromProgress(); e.preventDefault(); return; }
    if (state.screen !== 'play') return;
    if (d) { held.add(d); queued = d; e.preventDefault(); }
  });
  addEventListener('keyup', (e) => { const d = KEYS[e.key]; if (d) held.delete(d); });

  for (const btn of document.querySelectorAll('#pad button')) {
    const d = btn.dataset.dir;
    const press = (e) => {
      e.preventDefault();
      if (state.screen === 'title') { startFromProgress(); return; }
      if (state.screen !== 'play') return;
      held.add(d); queued = d; btn.classList.add('held');
    };
    const release = () => { held.delete(d); btn.classList.remove('held'); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  let sw = null;
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.screen === 'title') { startFromProgress(); return; }
    sw = { x: e.clientX, y: e.clientY, moved: false };
  });
  cv.addEventListener('pointermove', (e) => {
    if (!sw || state.screen !== 'play') return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.hypot(dx, dy) < 18) return;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    swipeDir = d; queued = d;
    sw.x = e.clientX; sw.y = e.clientY; sw.moved = true;
  });
  const endSwipe = () => { if (sw && !sw.moved) swipeDir = null; sw = null; };
  cv.addEventListener('pointerup', endSwipe);
  cv.addEventListener('pointercancel', endSwipe);

  el('cardgo').addEventListener('click', () => beginLevel(state.li));
  el('seetrip').addEventListener('click', () => { el('win').hidden = true; el('trip').hidden = false; });
  el('tripback').addEventListener('click', () => { el('trip').hidden = true; el('win').hidden = false; });
  for (const b of document.querySelectorAll('.again')) {
    b.addEventListener('click', () => { clearProgress(); showCard(0); });
  }

  // ---- sizing -------------------------------------------------------------
  // Fractional scaling on purpose: on a 3x phone screen the game pixels land on
  // 4 or 5 device pixels each, which reads as crisp. Integer-only scaling would
  // leave the screen tiny on most phones.
  function fit() {
    const vw = document.documentElement.clientWidth;
    const vh = window.visualViewport ? window.visualViewport.height : document.documentElement.clientHeight;
    const padH = 56 * 3 + 8 + 6 + 30 + 20;
    const availW = Math.min(vw - 32 - 20, 560);
    const availH = Math.max(200, vh - padH - 24 - 20);
    const scale = Math.min(availW / cv.width, availH / cv.height, 3);
    cv.style.width = Math.floor(cv.width * scale) + 'px';
    cv.style.height = Math.floor(cv.height * scale) + 'px';
  }
  addEventListener('resize', fit);
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();

  startTitle();
  (document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve())
    .catch(() => {}).finally(() => requestAnimationFrame(loop));
})();
</script>
